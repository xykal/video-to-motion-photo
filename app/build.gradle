plugins { id 'com.android.application' }

android {
    namespace 'id.xyverse.motionphoto'
    compileSdk 35
    defaultConfig {
        applicationId 'id.xyverse.motionphoto'
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName '0.6.0'
    }
    signingConfigs {
        release {
            def keystore = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

 dependencies {
    implementation 'androidx.media3:media3-transformer:1.9.4'
    implementation 'androidx.media3:media3-effect:1.9.4'
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'
    testImplementation 'junit:junit:4.13.2'
}
